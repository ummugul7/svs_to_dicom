[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "B",
    "SIM",
    "S",
    "DTZ",
    "N",
    "UP",
    "BLE",
    "FBT",
    "A",
    "C4",
    "PIE",
    "T20",
    "PT",
    "RET",
    "TID",
    "TCH",
    "ERA",
    "FLY",
    "NPY",
    "PERF",
    "RUF"
]

ignore = [
    "RUF0",
    "S105",
    "S603",
    "RET503",
    "PT019",
    "PERF203",
    "SIM105",
    "S101"
]
