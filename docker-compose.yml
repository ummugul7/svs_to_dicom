version: '3.8'
services:
  database:
    image: postgres:latest
    container_name: database
    ports:
      - "5433:5432"  # port çalışması olduğu için portlrı değiştiridm
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: 'admin123'
      POSTGRES_DB: 'svs_data_db'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - svs-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: 'admin@admin.com'  #pg admin araryüzüne girereken kullanılacak
      PGADMIN_DEFAULT_PASSWORD: 'admin123'
    ports:
      - "15432:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - svs-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  svs-network:
    driver: bridge
